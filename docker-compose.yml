services:
  postgres:
    image: postgres:16-alpine
    container_name: submitin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: formbuilder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Conversor .docx → PDF (módulo Documentos). GOTENBERG_URL=http://localhost:3030
  gotenberg:
    build: ./infra/gotenberg
    container_name: submitin-gotenberg
    restart: unless-stopped
    ports:
      - "3030:3000"

volumes:
  postgres_data:
